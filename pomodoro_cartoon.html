<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔋 Pop-Toon Pomodoro!</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #2b2d42;
    --panel: #ffffff;
    --text: #1a1a1a;
    --border: #1a1a1a;
    --shadow: #1a1a1a;
    
    /* Dynamic colors changed by JS */
    --primary: #ff4757;
    --primary-light: #ff6b81;
    --accent: #ffbe0b;
    --accent-light: #fff200;
    
    /* Mode Specific Themes */
    --focus-color: #ff4757;
    --focus-light: #ff6b81;
    --short-color: #2ed573;
    --short-light: #7bed9f;
    --long-color: #1e90ff;
    --long-light: #70a1ff;
  }

  * { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
    font-family: 'Fredoka', sans-serif;
  }

  body {
    background-color: var(--bg);
    background-image: 
      radial-gradient(var(--border) 15%, transparent 16%),
      radial-gradient(var(--border) 15%, transparent 16%);
    background-size: 30px 30px;
    background-position: 0 0, 15px 15px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
    transition: background-color 0.3s ease;
  }

  /* Comic-book Flash overlay on complete */
  .flash-screen {
    position: fixed;
    inset: 0;
    background-color: #fff;
    z-index: 999;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.1s ease;
  }
  .flash-screen.active {
    animation: comicFlash 0.4s steps(2, start);
  }
  @keyframes comicFlash {
    0%, 100% { opacity: 0; background-color: var(--accent); }
    50% { opacity: 0.8; background-color: #fff; }
  }

  /* ── MAIN CONTAINER ── */
  .container {
    background: var(--panel);
    border: 5px solid var(--border);
    box-shadow: 12px 12px 0px var(--shadow);
    border-radius: 32px;
    max-width: 500px;
    width: 100%;
    padding: 30px;
    position: relative;
    transform: rotate(-1deg);
    transition: transform 0.2s ease;
  }
  .container:hover {
    transform: rotate(0deg) scale(1.01);
  }

  /* ── MODE TABS ── */
  .tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 35px;
  }
  .tab {
    flex: 1;
    padding: 12px 8px;
    background: #fff;
    border: 4px solid var(--border);
    box-shadow: 4px 4px 0px var(--shadow);
    border-radius: 16px;
    font-size: 14px;
    font-weight: 700;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .tab:hover {
    transform: translateY(-2px);
    box-shadow: 6px 6px 0px var(--shadow);
  }
  .tab.active {
    background: var(--primary);
    color: white;
    transform: translateY(2px);
    box-shadow: 2px 2px 0px var(--shadow);
  }

  /* ── CARTOON ALARM CLOCK ELEMENT ── */
  .clock-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 30px;
    position: relative;
    height: 290px;
  }

  .cartoon-clock {
    position: absolute;
    width: 250px;
    height: 250px;
    background: #f1f2f6;
    border: 6px solid var(--border);
    border-radius: 50%;
    box-shadow: 10px 10px 0px var(--shadow);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Clock Bells (Sininhos atrás/em cima) */
  .clock-bell {
    position: absolute;
    width: 70px;
    height: 45px;
    background: var(--primary);
    border: 5px solid var(--border);
    border-radius: 50% 50% 0 0;
    top: -20px;
    z-index: -1;
    transition: transform 0.1s ease;
  }
  .clock-bell.left {
    left: -10px;
    transform: rotate(-35deg);
    transform-origin: bottom right;
  }
  .clock-bell.right {
    right: -10px;
    transform: rotate(35deg);
    transform-origin: bottom left;
  }
  
  /* Hammer/Striker */
  .clock-hammer {
    position: absolute;
    width: 12px;
    height: 30px;
    background: var(--border);
    top: -22px;
    left: calc(50% - 6px);
    z-index: -2;
    border-radius: 4px;
  }
  .clock-hammer::after {
    content: '';
    position: absolute;
    width: 24px;
    height: 24px;
    background: var(--accent);
    border: 4px solid var(--border);
    border-radius: 50%;
    top: -15px;
    left: -6px;
  }

  /* Clock Legs */
  .clock-leg {
    position: absolute;
    width: 24px;
    height: 45px;
    background: var(--border);
    bottom: -15px;
    z-index: -1;
    border-radius: 12px;
  }
  .clock-leg.left { left: 30px; transform: rotate(30deg); }
  .clock-leg.right { right: 30px; transform: rotate(-30deg); }

  /* ── SVG TIMER RING (O MIOLO) ── */
  .clock-face {
    position: relative;
    width: 216px;
    height: 216px;
    border-radius: 50%;
    background: #fff;
    border: 4px solid var(--border);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  svg.timer-ring {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }
  .ring-track {
    fill: none;
    stroke: #f1f2f6;
    stroke-width: 14;
  }
  .ring-progress {
    fill: none;
    stroke: var(--primary);
    stroke-width: 14;
    stroke-linecap: round;
    stroke-dasharray: 615.7; /* 2 * PI * 98 */
    stroke-dashoffset: 0;
    transition: stroke-dashoffset 0.3s linear, stroke 0.3s ease;
  }

  /* ── TIMER DIGITAL TEXT ── */
  .time-content {
    z-index: 2;
    text-align: center;
  }
  .time-display {
    font-family: 'Bungee', sans-serif;
    font-size: 46px;
    color: var(--text);
    line-height: 1;
    text-shadow: 4px 4px 0px rgba(0,0,0,0.15);
    margin-bottom: 5px;
  }
  .mode-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    background: var(--accent);
    color: var(--text);
    padding: 4px 10px;
    border: 2px solid var(--border);
    border-radius: 20px;
    box-shadow: 2px 2px 0px var(--shadow);
    display: inline-block;
  }

  /* ── ANIMATION STATES ── */
  /* Running / Breathing State */
  .cartoon-clock.running {
    animation: clockBreathe 1s infinite alternate ease-in-out;
  }
  .cartoon-clock.running .ring-progress {
    animation: progressPulse 2s infinite linear;
  }
  @keyframes clockBreathe {
    0% { transform: scale(1); }
    100% { transform: scale(1.03) rotate(1deg); }
  }

  /* Violent Ringing/Shaking State when done */
  .cartoon-clock.ringing {
    animation: clockRingtone 0.1s infinite alternate linear;
  }
  .cartoon-clock.ringing .clock-bell.left { animation: bellRingLeft 0.08s infinite alternate linear; }
  .cartoon-clock.ringing .clock-bell.right { animation: bellRingRight 0.08s infinite alternate linear; }
  
  @keyframes clockRingtone {
    0% { transform: translate(4px, 4px) rotate(-4deg); }
    100% { transform: translate(-4px, -4px) rotate(4deg); }
  }
  @keyframes bellRingLeft {
    0% { transform: rotate(-25deg); }
    100% { transform: rotate(-45deg); }
  }
  @keyframes bellRingRight {
    0% { transform: rotate(45deg); }
    100% { transform: rotate(25deg); }
  }

  /* ── CONTROLS ── */
  .controls {
    display: flex;
    gap: 15px;
    justify-content: center;
    margin-bottom: 30px;
  }
  .btn {
    font-family: 'Bungee', sans-serif;
    font-size: 16px;
    padding: 12px 28px;
    border: 4px solid var(--border);
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.1s ease;
  }
  .btn-start {
    background: var(--accent);
    color: var(--text);
    box-shadow: 5px 5px 0px var(--shadow);
  }
  .btn-start:hover {
    background: var(--accent-light);
    transform: translate(-2px, -2px);
    box-shadow: 7px 7px 0px var(--shadow);
  }
  .btn-start:active {
    transform: translate(4px, 4px);
    box-shadow: 1px 1px 0px var(--shadow);
  }
  .btn-reset {
    background: #f1f2f6;
    color: var(--text);
    box-shadow: 4px 4px 0px var(--shadow);
  }
  .btn-reset:hover {
    background: #fff;
    transform: translate(-2px, -2px);
    box-shadow: 6px 6px 0px var(--shadow);
  }
  .btn-reset:active {
    transform: translate(3px, 3px);
    box-shadow: 1px 1px 0px var(--shadow);
  }

  /* ── STATS ROW ── */
  .stats-row {
    display: flex;
    background: #f1f2f6;
    border: 4px solid var(--border);
    border-radius: 20px;
    padding: 15px 10px;
    margin-bottom: 25px;
    box-shadow: inset 4px 4px 0px rgba(0,0,0,0.05);
  }
  .stat {
    flex: 1;
    text-align: center;
    border-right: 3px dashed rgba(26,26,26,0.2);
  }
  .stat:last-child { border-right: none; }
  .stat-value {
    font-family: 'Bungee', sans-serif;
    font-size: 24px;
    color: var(--primary);
    line-height: 1.1;
  }
  .stat-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    color: #555;
    margin-top: 4px;
  }

  /* ── MOMENTARY HISTORY LOG ── */
  .history-box {
    background: #fff;
    border: 4px solid var(--border);
    border-radius: 20px;
    padding: 16px;
    margin-bottom: 25px;
    box-shadow: 4px 4px 0px var(--shadow);
    max-height: 160px;
    overflow-y: auto;
  }
  .history-header {
    font-family: 'Bungee', sans-serif;
    font-size: 12px;
    text-align: center;
    color: #777;
    margin-bottom: 10px;
    letter-spacing: 1px;
  }
  .history-list {
    list-style: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
  }
  .history-item {
    display: flex;
    justify-content: space-between;
    padding: 6px 4px;
    border-bottom: 2px dashed #f1f2f6;
    align-items: center;
  }
  .history-item:last-child { border-bottom: none; }
  .history-tag {
    font-weight: bold;
    padding: 2px 6px;
    border: 2px solid var(--border);
    border-radius: 6px;
    font-size: 10px;
    text-transform: uppercase;
  }

  /* ── SETTINGS COLLAPSIBLE ── */
  .settings-trigger {
    text-align: center;
    margin-bottom: 10px;
  }
  .settings-trigger button {
    background: none;
    border: none;
    font-family: 'Bungee', sans-serif;
    font-size: 11px;
    color: #777;
    cursor: pointer;
    transition: color 0.2s;
    text-decoration: underline;
  }
  .settings-trigger button:hover { color: var(--primary); }

  .settings-panel {
    background: #fff;
    border: 4px solid var(--border);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 4px 4px 0px var(--shadow);
    display: none;
    margin-bottom: 15px;
    animation: panelPop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .settings-panel.open { display: block; }
  @keyframes panelPop {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .settings-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 15px;
  }
  .input-group label {
    display: block;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    margin-bottom: 6px;
    color: #555;
    text-align: center;
  }
  .input-group input {
    width: 100%;
    padding: 8px;
    border: 3px solid var(--border);
    border-radius: 10px;
    font-family: 'Bungee', sans-serif;
    font-size: 14px;
    text-align: center;
    background: #f1f2f6;
  }

  .toggle-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-top: 2px dashed #f1f2f6;
  }
  .toggle-row label {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
  }
  
  /* Cartoon Select Dropdown */
  .cartoon-select {
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    padding: 6px 10px;
    border: 3px solid var(--border);
    border-radius: 10px;
    background: white;
    cursor: pointer;
  }

  /* Cartoon Switch checkbox */
  .switch {
    position: relative;
    width: 46px;
    height: 24px;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    inset: 0;
    background-color: #ccd1d9;
    border: 3px solid var(--border);
    border-radius: 24px;
    cursor: pointer;
    transition: .2s;
  }
  .slider::before {
    content: "";
    position: absolute;
    height: 12px; width: 12px;
    left: 4px; bottom: 3px;
    background-color: white;
    border: 2px solid var(--border);
    border-radius: 50%;
    transition: .2s;
  }
  input:checked + .slider { background-color: var(--primary); }
  input:checked + .slider::before { transform: translateX(20px); }

  .audio-indicator {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: #777;
  }
  .audio-dot {
    width: 8px;
    height: 8px;
    background: #ccd1d9;
    border-radius: 50%;
    border: 1px solid var(--border);
  }
  .audio-dot.active {
    background: var(--primary);
    animation: pulseDot 1s infinite alternate;
  }
  @keyframes pulseDot { from { opacity: 0.4; } to { opacity: 1; } }

  /* Decorative Star/Toon item */
  .toon-decoration {
    text-align: center;
    font-size: 20px;
    color: var(--accent);
    margin-top: 10px;
    animation: spinToon 4s infinite linear;
    display: inline-block;
    width: 100%;
  }
  
  /* Scrollbar Customization for cartoon look */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: #f1f2f6; border-radius: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

  @media (max-width: 400px) {
    .container { padding: 20px 15px; }
    .time-display { font-size: 38px; }
    .cartoon-clock { width: 220px; height: 220px; }
    .clock-face { width: 186px; height: 186px; }
  }
</style>
</head>
<body>

<div class="flash-screen" id="flashScreen"></div>

<div class="container">
  <!-- Mode Selection Tabs -->
  <div class="tabs">
    <button class="tab active" id="tab-focus" onclick="changeMode('focus')">Foco</button>
    <button class="tab" id="tab-short" onclick="changeMode('short')">Pausa Curta</button>
    <button class="tab" id="tab-long" onclick="changeMode('long')">Pausa Longa</button>
  </div>

  <!-- The Cartoon Clock Behind with Timer inside -->
  <div class="clock-wrapper">
    <div class="cartoon-clock" id="clockElement">
      <div class="clock-bell left"></div>
      <div class="clock-bell right"></div>
      <div class="clock-hammer"></div>
      <div class="clock-leg left"></div>
      <div class="clock-leg right"></div>
      
      <div class="clock-face">
        <!-- SVG Ring Overlay serving as Core/Timer layout -->
        <svg class="timer-ring" viewBox="0 0 210 210">
          <circle class="ring-track" cx="105" cy="105" r="98"/>
          <circle class="ring-progress" id="progressRing" cx="105" cy="105" r="98"/>
        </svg>
        
        <div class="time-content">
          <div class="time-display" id="timeDisplay">25:00</div>
          <div class="mode-label" id="modeLabel">Mandar Bala!</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Action Controls Buttons -->
  <div class="controls">
    <button class="btn btn-start" id="startBtn" onclick="toggleTimer()">Iniciar</button>
    <button class="btn btn-reset" onclick="resetTimer()">Zerar</button>
  </div>

  <!-- Stats Monitoring Grid -->
  <div class="stats-row">
    <div class="stat">
      <div class="stat-value" id="statSessions">0</div>
      <div class="stat-label">Sessões</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="statMinutes">0</div>
      <div class="stat-label">Min Focado</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="statStreak">0</div>
      <div class="stat-label">Combo</div>
    </div>
  </div>

  <!-- Realtime Volatile History Log -->
  <div class="history-box">
    <div class="history-header">✦ Histórico da Sessão ✦</div>
    <ul class="history-list" id="historyList">
      <li class="history-item" style="justify-content: center; color: #aaa;">Nenhum registro nesta rodada.</li>
    </ul>
  </div>

  <!-- Collapsible Setup configuration -->
  <div class="settings-trigger">
    <button onclick="toggleSettingsPanel()">⚙ Ajustar Tempos & Sons</button>
  </div>

  <div class="settings-panel" id="settingsPanel">
    <div class="settings-grid">
      <div class="input-group">
        <label>Foco</label>
        <input type="number" id="inputFocus" value="25" min="1" max="99" onchange="applyConfig()">
      </div>
      <div class="input-group">
        <label>P. Curta</label>
        <input type="number" id="inputShort" value="5" min="1" max="99" onchange="applyConfig()">
      </div>
      <div class="input-group">
        <label>P. Longa</label>
        <input type="number" id="inputLong" value="15" min="1" max="99" onchange="applyConfig()">
      </div>
    </div>

    <div class="toggle-row">
      <label>🔔 Despertador Espalhafatoso</label>
      <label class="switch">
        <input type="checkbox" id="checkAlarm" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <label>🌊 Ruído de Fundo</label>
      <select class="cartoon-select" id="selectAmbient" onchange="handleAmbientChange()">
        <option value="off">Nenhum</option>
        <option value="rain">Chuva Pesada</option>
        <option value="cafe">Cafeteria Toon</option>
        <option value="fireplace">Lareira Estalando</option>
        <option value="white">Ruído Branco</option>
      </select>
    </div>
    
    <div class="audio-indicator">
      <div class="audio-dot" id="audioDot"></div>
      <span id="audioStatus">Som de fundo inativo</span>
    </div>
  </div>

  <div class="toon-decoration">★</div>
</div>

<script>
  // ── CORE APPLICATION STATE ──
  let state = {
    mode: 'focus', // focus, short, long
    running: false,
    remaining: 25 * 60,
    total: 25 * 60,
    
    // Counter metrics
    sessions: 0,
    focusMinutes: 0,
    streak: 0,
    
    // Core engine trackers
    intervalId: null,
    history: [],
    
    // Audio engine nodes
    audioCtx: null,
    ambientSource: null,
    ambientGain: null
  };

  const MODE_CONFIGS = {
    focus: { label: 'Foco Total!', colorVar: '--focus-color', lightVar: '--focus-light', msg: 'Mandar Bala!' },
    short: { label: 'Respiro Rápido', colorVar: '--short-color', lightVar: '--short-light', msg: 'Relaxa!' },
    long:  { label: 'Descanso Longo', colorVar: '--long-color', lightVar: '--long-light', msg: 'Desliga!' }
  };

  const MAX_RING_CIRCUMFERENCE = 2 * Math.PI * 98; // ~615.75

  // Dom Node Bindings
  const timeDisplay = document.getElementById('timeDisplay');
  const modeLabel = document.getElementById('modeLabel');
  const progressRing = document.getElementById('progressRing');
  const startBtn = document.getElementById('startBtn');
  const clockElement = document.getElementById('clockElement');
  const flashScreen = document.getElementById('flashScreen');
  const historyList = document.getElementById('historyList');
  const audioDot = document.getElementById('audioDot');
  const audioStatus = document.getElementById('audioStatus');

  // Fetch customizable numeric inputs
  function getCustomDurations() {
    return {
      focus: (parseInt(document.getElementById('inputFocus').value) || 25) * 60,
      short: (parseInt(document.getElementById('inputShort').value) || 5) * 60,
      long:  (parseInt(document.getElementById('inputLong').value) || 15) * 60
    };
  }

  // Update digital clock interface text
  function formatTime(seconds) {
    const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
    const secs = String(seconds % 60).padStart(2, '0');
    return `${mins}:${secs}`;
  }

  // Synchronize radial core bar
  function syncProgressRing() {
    const ratio = state.remaining / state.total;
    const offset = MAX_RING_CIRCUMFERENCE * (1 - ratio);
    progressRing.style.strokeDashoffset = offset;
  }

  // General Screen UI Updates Renderer
  function renderUI() {
    timeDisplay.textContent = formatTime(state.remaining);
    modeLabel.textContent = MODE_CONFIGS[state.mode].msg;
    
    // Setup Theme colors based on selection
    const config = MODE_CONFIGS[state.mode];
    document.documentElement.style.setProperty('--primary', `var(${config.colorVar})`);
    document.documentElement.style.setProperty('--primary-light', `var(${config.lightVar})`);
    
    syncProgressRing();

    // Stats sync
    document.getElementById('statSessions').textContent = state.sessions;
    document.getElementById('statMinutes').textContent = state.focusMinutes;
    document.getElementById('statStreak').textContent = state.streak;

    // Handle action button text and visual class toggling
    if (state.running) {
      startBtn.textContent = 'Pausar';
      startBtn.style.background = 'var(--primary-light)';
      clockElement.classList.add('running');
    } else {
      startBtn.textContent = 'Iniciar';
      startBtn.style.background = 'var(--accent)';
      clockElement.classList.remove('running');
    }

    // Dynamic browser title bar ticking indicator
    document.title = state.running ? `(${formatTime(state.remaining)}) Pop-Toon!` : 'Pop-Toon Pomodoro!';
  }

  // Switch between timer context blocks
  function changeMode(targetMode) {
    clearInterval(state.intervalId);
    state.running = false;
    state.mode = targetMode;
    
    // Reset ring animation class cleanly
    clockElement.classList.remove('ringing');

    // Update active visual tabs
    document.querySelectorAll('.tab').forEach(btn => {
      btn.classList.toggle('active', btn.id === `tab-${targetMode}`);
    });

    const durations = getCustomDurations();
    state.total = durations[targetMode];
    state.remaining = state.total;

    renderUI();
  }

  // Handle configuration updates
  function applyConfig() {
    const durations = getCustomDurations();
    state.total = durations[state.mode];
    state.remaining = state.total;
    renderUI();
  }

  // Play/Pause engine trigger
  function toggleTimer() {
    // Dismiss active rings if user clicks during ring phase
    if (clockElement.classList.contains('ringing')) {
      clockElement.classList.remove('ringing');
      return;
    }

    if (state.running) {
      clearInterval(state.intervalId);
      state.running = false;
    } else {
      state.running = true;
      state.intervalId = setInterval(tickEngine, 1000);
      // Initialize Context on user interaction to clear browser permissions policies
      initAudioContext();
    }
    renderUI();
  }

  // Ticking cycle logic callback execution
  function tickEngine() {
    if (state.remaining > 0) {
      state.remaining--;
      syncProgressRing();
      timeDisplay.textContent = formatTime(state.remaining);
      document.title = `(${formatTime(state.remaining)}) Pop-Toon!`;
    } else {
      clearInterval(state.intervalId);
      state.running = false;
      handleCycleCompletion();
    }
  }

  // Handle complete sequences processing actions
  function handleCycleCompletion() {
    const durations = getCustomDurations();
    const currentMode = state.mode;

    // Log tracking data parameters metric changes
    const timeNow = new Date();
    const timestampStr = String(timeNow.getHours()).padStart(2, '0') + ':' + String(timeNow.getMinutes()).padStart(2, '0');
    
    let loggedDuration = Math.floor(state.total / 60);

    if (currentMode === 'focus') {
      state.sessions++;
      state.streak++;
      state.focusMinutes += loggedDuration;
    }

    // Append history data
    state.history.unshift({
      time: timestampStr,
      modeLabel: MODE_CONFIGS[currentMode].label,
      duration: loggedDuration,
      modeClass: currentMode
    });

    // Animate ringing cartoon elements wrappers
    clockElement.classList.add('ringing');
    flashScreen.classList.add('active');
    
    // Trigger procedural synthesized retro alarm clock ringing sounds
    if (document.getElementById('checkAlarm').checked) {
      triggerToonAlarmSound();
    }

    setTimeout(() => {
      flashScreen.classList.remove('active');
    }, 1000);

    updateHistoryLogUI();
    renderUI();

    // Auto router state scheduler switchover
    setTimeout(() => {
      // Only jump automatically if user hasn't cleared the alarm vibration manually
      if (clockElement.classList.contains('ringing')) {
        clockElement.classList.remove('ringing');
      }
      
      if (currentMode === 'focus') {
        if (state.sessions % 4 === 0) {
          changeMode('long');
        } else {
          changeMode('short');
        }
      } else {
        changeMode('focus');
      }
    }, 3500);
  }

  // UI volatile memory logger viewer sync
  function updateHistoryLogUI() {
    if (state.history.length === 0) {
      historyList.innerHTML = `<li class="history-item" style="justify-content: center; color: #aaa;">Nenhum registro nesta rodada.</li>`;
      return;
    }

    historyList.innerHTML = state.history.map(item => {
      let badgeColor = '#ff4757';
      if (item.modeClass === 'short') badgeColor = '#2ed573';
      if (item.modeClass === 'long') badgeColor = '#1e90ff';

      return `
        <li class="history-item">
          <span style="font-size: 11px; opacity: 0.6;">[${item.time}]</span>
          <span class="history-tag" style="background: ${badgeColor}; color: white;">${item.modeLabel}</span>
          <span style="font-weight: 700;">+${item.duration}m</span>
        </li>
      `;
    }).join('');
  }

  // Clear tracking configurations data models states
  function resetTimer() {
    clearInterval(state.intervalId);
    state.running = false;
    clockElement.classList.remove('ringing');
    applyConfig();
  }

  // Structural collapsible toggler container visibility handler
  function toggleSettingsPanel() {
    const panel = document.getElementById('settingsPanel');
    panel.classList.toggle('open');
  }

  // ── PROCEDURAL SYNTHESIZED COMIC AUDIO ARCHITECTURE (WEB AUDIO API) ──
  function initAudioContext() {
    if (!state.audioCtx) {
      state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      state.ambientGain = state.audioCtx.createGain();
      state.ambientGain.gain.value = 0.15; // Safe ambient volume limit
      state.ambientGain.connect(state.audioCtx.destination);
    }
    if (state.audioCtx.state === 'suspended') {
      state.audioCtx.resume();
    }
  }

  // Synthesize an extreme crazy comic alarm bell ringing sequence dynamically
  function triggerToonAlarmSound() {
    initAudioContext();
    const ctx = state.audioCtx;
    const now = ctx.currentTime;
    
    // Create twin bell chime modulators using high speed pulse oscillators alternation
    for (let i = 0; i < 15; i++) {
      const strikeTime = now + (i * 0.18);
      
      // Dual structural frequencies mimicking actual physical alarm bells alignment resonance
      [880, 920].forEach((freq) => {
        const osc = ctx.createOscillator();
        const gainNode = ctx.createGain();
        
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, strikeTime);
        
        // Exaggerated fast vibrato frequency envelope
        osc.frequency.linearRampToValueAtTime(freq + (Math.random() * 40 - 20), strikeTime + 0.12);
        
        gainNode.gain.setValueAtTime(0.4, strikeTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, strikeTime + 0.15);
        
        osc.connect(gainNode);
        gainNode.connect(ctx.destination);
        
        osc.start(strikeTime);
        osc.stop(strikeTime + 0.16);
      });
    }
  }

  // Stop background atmospheric sound loops
  function killAmbientLoop() {
    if (state.ambientSource) {
      try { state.ambientSource.stop(); } catch(e) {}
      state.ambientSource = null;
    }
    audioDot.classList.remove('active');
    audioStatus.textContent = 'Som de fundo inativo';
  }

  // Background Ambient Procedural Generators Engine Switchboard Router Matrix
  function handleAmbientChange() {
    killAmbientLoop();
    const type = document.getElementById('selectAmbient').value;
    if (type === 'off') return;

    initAudioContext();
    const ctx = state.audioCtx;
    
    // Generate an isolation buffer pipeline channel array
    const sampleRate = ctx.sampleRate;
    const bufferSize = sampleRate * 4; // 4 Seconds Loopable block data
    const buffer = ctx.createBuffer(2, bufferSize, sampleRate);

    // Populate buffers with mathematical synthesis functions formulas
    for (let channel = 0; channel < 2; channel++) {
      const data = buffer.getChannelData(channel);
      
      if (type === 'white') {
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }
      } else if (type === 'rain') {
        // Pink/Brownish filtration formula for dense rain soundscapes
        let b0=0, b1=0, b2=0, b3=0, b4=0, b5=0;
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          b0 = 0.99886 * b0 + white * 0.0555179;
          b1 = 0.99332 * b1 + white * 0.0750759;
          b2 = 0.96900 * b2 + white * 0.1538520;
          b3 = 0.86650 * b3 + white * 0.3104856;
          b4 = 0.55000 * b4 + white * 0.5329522;
          b5 = -0.7616 * b5 - white * 0.0168980;
          data[i] = (b0 + b1 + b2 + b3 + b4 + b5) * 0.13;
        }
      } else if (type === 'cafe') {
        // Low-frequency rolling murmurs with periodic random click variations
        let lastVal = 0;
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          lastVal = (lastVal + white * 0.015) / 1.015;
          // Add simulated cup click artifacts patterns periodically
          let crackle = (Math.random() > 0.9998) ? (Math.random() * 0.6 - 0.3) : 0;
          data[i] = (lastVal * 6) + crackle;
        }
      } else if (type === 'fireplace') {
        // Warm brown rumble sequence combined with sudden crisp crackle snaps
        let lastVal = 0;
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          lastVal = (lastVal + white * 0.025) / 1.025; // heavy low pass filter
          let crackle = 0;
          if (Math.random() > 0.9992) {
            crackle = (Math.random() * 2 - 1) * 0.7;
          }
          data[i] = (lastVal * 2) + crackle;
        }
      }
    }

    // Hook generated procedural noise parameters up to output lines loopers
    state.ambientSource = ctx.createBufferSource();
    state.ambientSource.buffer = buffer;
    state.ambientSource.loop = true;
    
    state.ambientSource.connect(state.ambientGain);
    state.ambientSource.start();

    // Trigger visual feedback lines update markers indicators
    audioDot.classList.add('active');
    const selectorsListLabels = { rain: 'CHUVA PESADA', cafe: 'CAFETERIA TOON', fireplace: 'LAREIRA REPRODUZINDO', white: 'RUÍDO BRANCO' };
    audioStatus.textContent = `${selectorsListLabels[type]} ATIVO`;
  }

  // Kickstart system rendering engines profiles
  renderUI();
</script>
</body>
</html>
